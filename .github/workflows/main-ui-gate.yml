name: Main UI Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-ui-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-ui:
    name: Desktop UI build and audit
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            Nexus Main/package-lock.json
            packages/nexus-core/package-lock.json

      - name: Install Nexus Core
        shell: pwsh
        run: npm --prefix "packages/nexus-core" ci

      - name: Install Main dependencies
        shell: pwsh
        run: npm --prefix "Nexus Main" ci

      - name: Verify single React runtime
        shell: pwsh
        run: npm run verify:single-react

      - name: Build Nexus Main
        shell: pwsh
        run: npm --prefix "Nexus Main" run build

      - name: Audit Main dependencies
        shell: pwsh
        run: npm --prefix "Nexus Main" audit --audit-level=moderate
