name: Build Android Release Candidates

on:
  workflow_dispatch:
    inputs:
      signing_required:
        description: "Sign bundles on protected runners (main only)"
        type: boolean
        default: false
      publish_release_assets:
        description: "Attach signed bundles to an existing release at this commit"
        type: boolean
        default: false
      release_tag:
        description: "Existing release tag at the workflow commit"
        type: string
        default: ""
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: "Nexus Mobile"
            app_slug: "nexus-mobile"
          - app_dir: "Nexus Code Mobile"
            app_slug: "nexus-code-mobile"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Validate requested authority
        shell: bash
        env:
          REQUESTED: "${{ inputs.signing_required || inputs.publish_release_assets }}"
          PUBLISH: "${{ inputs.publish_release_assets }}"
          RELEASE_TAG: "${{ inputs.release_tag }}"
        run: |
          set -euo pipefail
          if [[ "$REQUESTED" == true && ("$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main) ]]; then
            echo "::error::Signing and publishing require a manual main run."
            exit 1
          fi
          if [[ "$PUBLISH" == true && ! "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error::An explicit existing version tag is required."
            exit 1
          fi
      - name: Verify Android authority policy
        run: |
          node --test tools/android-workflow.test.mjs tools/release-hardening.test.mjs
          node tools/android-bundle-native-regression.mjs --java-home "$JAVA_HOME"
      - name: Install and audit shared-core dependencies
        run: |
          npm ci --prefix packages/nexus-core
          npm audit --prefix packages/nexus-core --audit-level=moderate
      - name: Install application dependencies
        working-directory: "${{ matrix.app_dir }}"
        run: npm ci
      - name: Audit application dependencies
        working-directory: "${{ matrix.app_dir }}"
        run: npm audit --audit-level=moderate
      - name: Build fresh web assets
        working-directory: "${{ matrix.app_dir }}"
        run: npm run build
      - name: Sync Android assets
        working-directory: "${{ matrix.app_dir }}"
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android
      - name: Build unsigned candidate
        working-directory: "${{ matrix.app_dir }}/android"
        run: ./gradlew --no-daemon bundleRelease -PnexusUnsignedCandidate=true
      - name: Validate and prepare unsigned data
        run: node tools/android-bundle.mjs prepare --app "${{ matrix.app_slug }}" --input "${{ matrix.app_dir }}/android/app/build/outputs/bundle/release/app-release.aab" --output "${{ runner.temp }}/android-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "android-candidate-${{ matrix.app_slug }}-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/android-candidate"
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.signing_required || inputs.publish_release_assets)
    environment: release-android-signing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app_slug: [nexus-mobile, nexus-code-mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "android-candidate-${{ matrix.app_slug }}-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/android-candidate"
      - name: Validate bundle before credentials
        run: node tools/android-bundle.mjs validate --app "${{ matrix.app_slug }}" --directory "${{ runner.temp }}/android-candidate"
      - name: Sign and strictly verify Android bundle
        env:
          ANDROID_KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: node tools/android-bundle.mjs sign --app "${{ matrix.app_slug }}" --directory "${{ runner.temp }}/android-candidate" --output "${{ runner.temp }}/android-signed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "android-signed-${{ matrix.app_slug }}-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/android-signed"
          if-no-files-found: error
          retention-days: 7

  checksums:
    needs: sign
    environment: release-checksum-signing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app_slug: [nexus-mobile, nexus-code-mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "android-signed-${{ matrix.app_slug }}-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/android-signed"
      - name: Validate signed handoff before checksum credentials
        run: node tools/android-bundle.mjs validate-data --signed --app "${{ matrix.app_slug }}" --directory "${{ runner.temp }}/android-signed"
      - name: Sign Android checksums
        env:
          NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_PEM: "${{ secrets.NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_PEM }}"
          NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_BASE64: "${{ secrets.NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_BASE64 }}"
          NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_ID: "${{ vars.NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_ID }}"
        run: node tools/generate-installer-checksums.mjs --dir "${{ runner.temp }}/android-signed" --output-prefix "${{ matrix.app_slug }}-android" --require-signature
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "android-distribution-${{ matrix.app_slug }}-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/android-signed"
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: checksums
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release_assets
    environment: release-publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "android-distribution-*-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/android-release"
          merge-multiple: true
      - name: Publish validated bundles to existing release
        env:
          GH_TOKEN: "${{ github.token }}"
          NEXUS_RELEASE_TAG: "${{ inputs.release_tag }}"
        run: node tools/publish-android.mjs --directory "${{ runner.temp }}/android-release"
