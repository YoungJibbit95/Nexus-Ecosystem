name: Build Signed Android Releases

on:
  workflow_dispatch:
    inputs:
      publish_release_assets:
        description: "Attach signed Android bundles to an existing GitHub Release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Existing GitHub Release tag used when publishing assets"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: "${{ matrix.app_name }} (Android release)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: "Nexus Mobile"
            app_slug: "nexus-mobile"
            app_dir: "Nexus Mobile"
          - app_name: "Nexus Code Mobile"
            app_slug: "nexus-code-mobile"
            app_dir: "Nexus Code Mobile"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "${{ matrix.app_dir }}/package-lock.json"

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        working-directory: "${{ matrix.app_dir }}"
        run: npm ci

      - name: Validate signing configuration
        env:
          NEXUS_SIGNING_REQUIRED: "true"
          ANDROID_KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: node ./tools/verify-signing-env.mjs --target=android --required

      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
        run: |
          set -euo pipefail
          install -m 700 -d "${RUNNER_TEMP}/nexus-signing"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/nexus-signing/release.jks"
          chmod 600 "${RUNNER_TEMP}/nexus-signing/release.jks"

      - name: Sync native project
        working-directory: "${{ matrix.app_dir }}"
        run: npm run cap:sync

      - name: Build signed app bundle
        working-directory: "${{ matrix.app_dir }}/android"
        env:
          NEXUS_ANDROID_KEYSTORE_FILE: "${{ runner.temp }}/nexus-signing/release.jks"
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: ./gradlew --no-daemon bundleRelease

      - name: Name release bundle
        working-directory: "${{ matrix.app_dir }}/android"
        shell: bash
        run: mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/${{ matrix.app_slug }}-android-release.aab"

      - name: Verify bundle signature
        working-directory: "${{ matrix.app_dir }}/android"
        run: jarsigner -verify -strict -certs "app/build/outputs/bundle/release/${{ matrix.app_slug }}-android-release.aab"

      - name: Generate signed checksums
        env:
          NEXUS_INSTALLER_CHECKSUM_SIGNATURE_REQUIRED: "true"
          NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_PEM: "${{ secrets.NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_PEM }}"
          NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_BASE64: "${{ secrets.NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_BASE64 }}"
          NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_ID: "${{ vars.NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_ID }}"
          NEXUS_LAUNCHER_FEED_SIGNING_KEY_PEM: "${{ secrets.NEXUS_LAUNCHER_FEED_SIGNING_KEY_PEM }}"
          NEXUS_LAUNCHER_FEED_SIGNING_KEY_BASE64: "${{ secrets.NEXUS_LAUNCHER_FEED_SIGNING_KEY_BASE64 }}"
        run: node ./tools/generate-installer-checksums.mjs --dir "${{ matrix.app_dir }}/android/app/build/outputs/bundle/release" --output-prefix "${{ matrix.app_slug }}-android"

      - name: Upload Android release
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.app_slug }}-android-release"
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ matrix.app_dir }}/android/app/build/outputs/bundle/release/*.aab
            ${{ matrix.app_dir }}/android/app/build/outputs/bundle/release/*SHA256SUMS.txt
            ${{ matrix.app_dir }}/android/app/build/outputs/bundle/release/*SHA256SUMS.txt.sig
            ${{ matrix.app_dir }}/android/app/build/outputs/bundle/release/*SHA256SUMS.metadata.json

      - name: Validate manual release target
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release_assets
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          NEXUS_RELEASE_TAG: "${{ inputs.release_tag }}"
        run: |
          set -euo pipefail
          if [[ -z "${NEXUS_RELEASE_TAG}" ]]; then
            echo "::error title=Missing release tag::release_tag is required when publish_release_assets is enabled."
            exit 1
          fi
          gh release view "${NEXUS_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null

      - name: Attach Android bundle to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release_assets)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}"
          fail_on_unmatched_files: true
          files: |
            ${{ matrix.app_dir }}/android/app/build/outputs/bundle/release/*.aab
            ${{ matrix.app_dir }}/android/app/build/outputs/bundle/release/*SHA256SUMS.txt
            ${{ matrix.app_dir }}/android/app/build/outputs/bundle/release/*SHA256SUMS.txt.sig
            ${{ matrix.app_dir }}/android/app/build/outputs/bundle/release/*SHA256SUMS.metadata.json
