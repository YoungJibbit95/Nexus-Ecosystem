name: Contract Parity E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install locked public package dependencies
        run: node tools/install-public-packages.mjs

      - name: Verify contracts and security
        run: npm run verify:public

      - name: Build Main
        run: npm --prefix "./Nexus Main" run build

      - name: Build Mobile
        run: npm --prefix "./Nexus Mobile" run build

      - name: Build Code
        run: npm --prefix "./Nexus Code" run build

      - name: Build Code Mobile
        run: npm --prefix "./Nexus Code Mobile" run build

      - name: Public surface guard
        run: |
          npm run check:no-private-strings
          npm run check:secrets
