name: Contract Parity E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install locked public package dependencies
        run: node tools/install-public-packages.mjs

      - name: Verify contracts and security
        run: npm run verify:public

      - name: Build Main
        run: npm --prefix "./Nexus Main" run build

      - name: Build Mobile
        run: npm --prefix "./Nexus Mobile" run build

      - name: Build Code
        run: npm --prefix "./Nexus Code" run build

      - name: Build Code Mobile
        run: npm --prefix "./Nexus Code Mobile" run build

      - name: Public surface guard
        run: |
          npm run check:no-private-strings
          npm run check:secrets
