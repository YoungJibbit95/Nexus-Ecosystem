name: Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gate:
    name: Release Gate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/nexus-core/package-lock.json
            Nexus Main/package-lock.json
            Nexus Mobile/package-lock.json
            Nexus Code/package-lock.json
            Nexus Code Mobile/package-lock.json
            Nexus Wiki/package-lock.json

      - name: Install package dependencies
        run: node tools/install-public-packages.mjs

      - name: Run Nexus Code security attack regression
        run: npm --prefix "./Nexus Code" run test:security

      - name: Run public repository release checks
        run: npm run release:gate -- --ci --public-only
