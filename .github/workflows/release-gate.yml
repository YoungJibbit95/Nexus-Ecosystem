name: Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gate:
    name: Release Gate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/nexus-core/package-lock.json
            Nexus Main/package-lock.json
            Nexus Mobile/package-lock.json
            Nexus Code/package-lock.json
            Nexus Code Mobile/package-lock.json
            Nexus Wiki/package-lock.json

      - name: Install package dependencies
        run: node tools/install-public-packages.mjs

      - name: Run Nexus Code security attack regression
        run: npm --prefix "./Nexus Code" run test:security

      - name: Run public repository release checks
        run: npm run release:gate -- --ci --public-only
