name: Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  release-gate:
    name: Release Gate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/nexus-core/package-lock.json
            Nexus Main/package-lock.json
            Nexus Mobile/package-lock.json
            Nexus Code/package-lock.json
            Nexus Code Mobile/package-lock.json
            Nexus Wiki/package-lock.json

      - name: Install package dependencies
        run: node tools/install-public-packages.mjs

      - name: Run public repository release checks
        run: npm run release:gate -- --ci --public-only
