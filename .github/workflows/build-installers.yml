name: Build Electron Installers

on:
  workflow_dispatch:
    inputs:
      signing_required:
        description: "Sign and notarize on protected runners (main only)"
        type: boolean
        default: false
      notarize_macos:
        description: "Require signed and notarized packages (main only)"
        type: boolean
        default: false
      publish_release_assets:
        description: "Attach signed installers to an existing release at this commit"
        type: boolean
        default: false
      release_tag:
        description: "Existing release tag at the workflow commit"
        type: string
        default: ""
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build payload: ${{ matrix.app_dir }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: "Nexus Main"
            app_slug: "nexus-main"
          - app_dir: "Nexus Code"
            app_slug: "nexus-code"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "${{ matrix.app_dir }}/package-lock.json"
      - name: Validate requested authority
        shell: bash
        env:
          REQUESTED: "${{ inputs.signing_required || inputs.notarize_macos || inputs.publish_release_assets }}"
          PUBLISH: "${{ inputs.publish_release_assets }}"
          RELEASE_TAG: "${{ inputs.release_tag }}"
        run: |
          set -euo pipefail
          if [[ "$REQUESTED" == true && ("$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main) ]]; then
            echo "::error::Signing and publishing require a manual main run."
            exit 1
          fi
          if [[ "$PUBLISH" == true && ! "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error::An explicit existing version tag is required."
            exit 1
          fi
      - name: Verify packaging policy and trusted toolchain
        run: |
          node --test tools/installer-payload.test.mjs tools/installer-workflow.test.mjs tools/release-hardening.test.mjs
          npm --prefix tools/release-packager audit --audit-level=moderate
      - name: Install and audit shared-core dependencies
        run: |
          npm ci --prefix packages/nexus-core
          npm audit --prefix packages/nexus-core --audit-level=moderate
      - name: Install application dependencies
        working-directory: "${{ matrix.app_dir }}"
        run: npm ci
      - name: Audit application dependencies
        working-directory: "${{ matrix.app_dir }}"
        run: npm audit --audit-level=moderate
      - name: Build application without signing authority
        working-directory: "${{ matrix.app_dir }}"
        run: npm run build
      - name: Prepare static application payload
        run: node tools/installer-payload.mjs prepare --app "${{ matrix.app_dir }}" --output "${{ runner.temp }}/payload"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "payload-${{ matrix.app_slug }}-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/payload"
          if-no-files-found: error
          retention-days: 7

  package:
    name: "Package: ${{ matrix.app_slug }} ${{ matrix.target }}-${{ matrix.arch }}"
    needs: build
    runs-on: ${{ matrix.os }}
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.signing_required || inputs.notarize_macos || inputs.publish_release_assets)) && 'release-platform-signing' || 'release-candidate' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "macos-latest"
            app_dir: "Nexus Main"
            app_slug: "nexus-main"
            target: "mac"
            arch: "arm64"
          - os: "macos-latest"
            app_dir: "Nexus Main"
            app_slug: "nexus-main"
            target: "mac"
            arch: "x64"
          - os: "windows-latest"
            app_dir: "Nexus Main"
            app_slug: "nexus-main"
            target: "win"
            arch: "x64"
          - os: "ubuntu-latest"
            app_dir: "Nexus Main"
            app_slug: "nexus-main"
            target: "linux"
            arch: "x64"
          - os: "macos-latest"
            app_dir: "Nexus Code"
            app_slug: "nexus-code"
            target: "mac"
            arch: "arm64"
          - os: "macos-latest"
            app_dir: "Nexus Code"
            app_slug: "nexus-code"
            target: "mac"
            arch: "x64"
          - os: "windows-latest"
            app_dir: "Nexus Code"
            app_slug: "nexus-code"
            target: "win"
            arch: "x64"
          - os: "ubuntu-latest"
            app_dir: "Nexus Code"
            app_slug: "nexus-code"
            target: "linux"
            arch: "x64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            Nexus Main/package.json
            Nexus Main/package-lock.json
            Nexus Main/icons
            Nexus Main/build/entitlements.mac.plist
            Nexus Code/package.json
            Nexus Code/package-lock.json
            Nexus Code/assets/icons
            Nexus Code/build/entitlements.mac.plist
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install locked packaging tools before credentials
        working-directory: tools/release-packager
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "payload-${{ matrix.app_slug }}-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/payload"
      - name: Validate payload before credentials
        run: node tools/installer-payload.mjs validate --app "${{ matrix.app_dir }}" --payload "${{ runner.temp }}/payload"
      - name: Package unsigned candidate or Linux distribution
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.signing_required || inputs.notarize_macos || inputs.publish_release_assets)) || matrix.target == 'linux' }}
        run: node tools/installer-payload.mjs package --app "${{ matrix.app_dir }}" --payload "${{ runner.temp }}/payload" --project "${{ runner.temp }}/packaging" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}"
      - name: Package and sign Windows
        if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.signing_required || inputs.notarize_macos || inputs.publish_release_assets)) && matrix.target == 'win' }}
        env:
          CSC_LINK: "${{ secrets.WIN_CSC_LINK }}"
          CSC_KEY_PASSWORD: "${{ secrets.WIN_CSC_KEY_PASSWORD }}"
        run: node tools/installer-payload.mjs package --app "${{ matrix.app_dir }}" --payload "${{ runner.temp }}/payload" --project "${{ runner.temp }}/packaging" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}" --signed
      - name: Package, sign and notarize macOS
        if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.signing_required || inputs.notarize_macos || inputs.publish_release_assets)) && matrix.target == 'mac' }}
        env:
          CSC_LINK: "${{ secrets.MAC_CSC_LINK }}"
          CSC_KEY_PASSWORD: "${{ secrets.MAC_CSC_KEY_PASSWORD }}"
          APPLE_ID: "${{ secrets.APPLE_ID }}"
          APPLE_APP_SPECIFIC_PASSWORD: "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
          APPLE_TEAM_ID: "${{ secrets.APPLE_TEAM_ID }}"
        run: node tools/installer-payload.mjs package --app "${{ matrix.app_dir }}" --payload "${{ runner.temp }}/payload" --project "${{ runner.temp }}/packaging" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}" --signed
      - name: Notarize macOS distribution
        if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.signing_required || inputs.notarize_macos || inputs.publish_release_assets)) && matrix.target == 'mac' }}
        shell: bash
        env:
          APPLE_ID: "${{ secrets.APPLE_ID }}"
          APPLE_APP_SPECIFIC_PASSWORD: "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
          APPLE_TEAM_ID: "${{ secrets.APPLE_TEAM_ID }}"
          RELEASE_DIRECTORY: "${{ runner.temp }}/packaging/release"
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            count=$((count + 1))
          done < <(find "$RELEASE_DIRECTORY" -maxdepth 1 -type f -name '*.dmg' -print0)
          [[ "$count" -gt 0 ]] || { echo "::error::No DMG produced."; exit 1; }
      - name: Verify macOS code signatures and notarization
        if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.signing_required || inputs.notarize_macos || inputs.publish_release_assets)) && matrix.target == 'mac' }}
        shell: bash
        env:
          RELEASE_DIRECTORY: "${{ runner.temp }}/packaging/release"
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            count=$((count + 1))
          done < <(find "$RELEASE_DIRECTORY" -type d -name '*.app' -prune -print0)
          [[ "$count" -gt 0 ]] || { echo "::error::No signed macOS app produced."; exit 1; }
      - name: Verify Windows Authenticode signatures
        if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.signing_required || inputs.notarize_macos || inputs.publish_release_assets)) && matrix.target == 'win' }}
        shell: pwsh
        env:
          RELEASE_DIRECTORY: "${{ runner.temp }}/packaging/release"
        run: |
          $files = @(Get-ChildItem -LiteralPath $env:RELEASE_DIRECTORY -Recurse -File -Filter *.exe)
          if ($files.Count -eq 0) { throw 'No Windows executable was produced.' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw 'Invalid Authenticode signature.' }
          }
      - name: Collect distribution files only
        run: node tools/installer-payload.mjs collect --app "${{ matrix.app_dir }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}" --directory "${{ runner.temp }}/packaging/release" --output "${{ runner.temp }}/distribution"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "installers-${{ matrix.app_slug }}-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/distribution"
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: "Checksums: ${{ matrix.app_slug }} ${{ matrix.target }}-${{ matrix.arch }}"
    needs: package
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.signing_required || inputs.notarize_macos || inputs.publish_release_assets)) && 'release-checksum-signing' || 'release-candidate' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "macos-latest"
            app_dir: "Nexus Main"
            app_slug: "nexus-main"
            target: "mac"
            arch: "arm64"
          - os: "macos-latest"
            app_dir: "Nexus Main"
            app_slug: "nexus-main"
            target: "mac"
            arch: "x64"
          - os: "windows-latest"
            app_dir: "Nexus Main"
            app_slug: "nexus-main"
            target: "win"
            arch: "x64"
          - os: "ubuntu-latest"
            app_dir: "Nexus Main"
            app_slug: "nexus-main"
            target: "linux"
            arch: "x64"
          - os: "macos-latest"
            app_dir: "Nexus Code"
            app_slug: "nexus-code"
            target: "mac"
            arch: "arm64"
          - os: "macos-latest"
            app_dir: "Nexus Code"
            app_slug: "nexus-code"
            target: "mac"
            arch: "x64"
          - os: "windows-latest"
            app_dir: "Nexus Code"
            app_slug: "nexus-code"
            target: "win"
            arch: "x64"
          - os: "ubuntu-latest"
            app_dir: "Nexus Code"
            app_slug: "nexus-code"
            target: "linux"
            arch: "x64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            Nexus Main/package.json
            Nexus Main/package-lock.json
            Nexus Code/package.json
            Nexus Code/package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "installers-${{ matrix.app_slug }}-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/distribution"
      - name: Validate distribution before checksum credentials
        run: node tools/installer-payload.mjs validate-distribution --app "${{ matrix.app_dir }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}" --directory "${{ runner.temp }}/distribution"
      - name: Generate unsigned candidate checksums
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.signing_required || inputs.notarize_macos || inputs.publish_release_assets)) }}
        run: node tools/generate-installer-checksums.mjs --dir "${{ runner.temp }}/distribution" --output-prefix "${{ matrix.app_slug }}-${{ matrix.target }}-${{ matrix.arch }}"
      - name: Sign installer checksums
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.signing_required || inputs.notarize_macos || inputs.publish_release_assets) }}
        env:
          NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_PEM: "${{ secrets.NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_PEM }}"
          NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_BASE64: "${{ secrets.NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_BASE64 }}"
          NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_ID: "${{ vars.NEXUS_INSTALLER_CHECKSUM_SIGNING_KEY_ID }}"
        run: node tools/generate-installer-checksums.mjs --dir "${{ runner.temp }}/distribution" --require-signature --output-prefix "${{ matrix.app_slug }}-${{ matrix.target }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "checksummed-${{ matrix.app_slug }}-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/distribution"
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish approved existing release
    needs: checksums
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release_assets
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            Nexus Main/package.json
            Nexus Main/package-lock.json
            Nexus Code/package.json
            Nexus Code/package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "checksummed-*-${{ github.sha }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/approved-release"
          merge-multiple: true
      - name: Publish to the verified existing release
        env:
          GH_TOKEN: "${{ github.token }}"
          NEXUS_RELEASE_TAG: "${{ inputs.release_tag }}"
        run: node tools/publish-installers.mjs --directory "${{ runner.temp }}/approved-release"
