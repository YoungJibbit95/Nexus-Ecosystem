name: Security Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-ecosystem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify CI authority policy
        run: node --test .github/scripts/ci-authority.test.mjs

      - name: Check public surface
        run: |
          npm run check:no-private-strings
          npm run check:secrets

      - name: Verify Ecosystem Contracts/Security
        run: npm run verify:ecosystem
