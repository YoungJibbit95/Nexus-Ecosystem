name: Security Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-ecosystem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Verify CI authority policy
        run: node --test .github/scripts/ci-authority.test.mjs

      - name: Check public surface
        run: |
          npm run check:no-private-strings
          npm run check:secrets

      - name: Verify Ecosystem Contracts/Security
        run: npm run verify:ecosystem
