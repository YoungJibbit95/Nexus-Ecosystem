name: Source Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      history_audit:
        description: Run the separate full-history incident audit (open findings remain red)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify scanner regressions
        run: node --test .security/scan.test.mjs .security/policy.test.mjs
      - name: Scan current source and introduced commit content
        env:
          NEXUS_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NEXUS_SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .security/ci.mjs

  history-incident-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.history_audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Audit history without suppression
        run: node .security/scan.mjs history
